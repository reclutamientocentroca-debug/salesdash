<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Icono de pestaña.

    Lleva la S del logotipo y no el gráfico de barras del símbolo completo: a
    32 píxeles —16 en la mayoría de pestañas— tres barras y una línea de cuatro
    nodos se convierten en una mancha. Una letra sobrevive a ese tamaño, y es
    lo que el ojo distingue en una fila de veinte pestañas abiertas.

    La S va trazada como recorrido, no como texto: una fuente puede no estar
    disponible donde se renderice el icono; un trazo se ve igual siempre.

    Mismos tres tonos y misma dirección que el degradado de src/components/Marca.tsx.
  -->
  <defs>
    <linearGradient id="s" x1="0" y1="32" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f7ff0"/>
      <stop offset="0.52" stop-color="#1fa8c9"/>
      <stop offset="1" stop-color="#2ed8a7"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#s)"/>
  <path
    d="M21.2 11C21.2 8.3 18.6 6.7 16 6.7C13.2 6.7 10.8 8.2 10.8 10.7C10.8 13.3 13 14.4 16 15.3C19 16.2 21.3 17.4 21.3 20.1C21.3 22.9 18.7 24.7 16 24.7C13.3 24.7 10.6 23.3 10.6 20.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="3.1"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
